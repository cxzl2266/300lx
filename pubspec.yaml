name: crane_app
description: "吊車作業模擬（KATO 300LX）手機網頁版"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/cranes/kato_300lx.json
    - assets/fonts/OFL.txt
  fonts:
    # Noto Sans TC（SIL Open Font License 1.1）：Windows 內建 NotoSansTC-VF.ttf，
    # 由 tool/make_font.py 用 Flutter 的 font-subset 裁成常用字（Big5 常用字 + 程式用到的字 + 符號）
    - family: NotoSansTC
      fonts:
        - asset: assets/fonts/NotoSansTC-Subset.ttf
